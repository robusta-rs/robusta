[package]
name = "robusta_track_memory_allocations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Per-stage allocation tracking for Robusta's pipeline."

[lints]
workspace = true

[lib]
test = false
doctest = false

[[bin]]
name = "robusta_track_memory_allocations"
test = false
doctest = false

[dependencies]
robusta_allocator = { workspace = true, features = ["track_allocations"] }
robusta_formatter.workspace = true
robusta_parser.workspace = true
robusta_semantic.workspace = true
robusta_tasks_common.workspace = true

humansize.workspace = true
mimalloc-safe.workspace = true
serde-saphyr.workspace = true

[features]
# Sentinel flag that should only get enabled if we're running under `--all-features`
is_all_features = []
