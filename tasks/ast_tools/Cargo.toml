[package]
name = "robusta_ast_tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Generates the committed sources derived from robusta's AST definitions."

[lints]
workspace = true

[lib]
doctest = false

[[bin]]
name = "robusta_ast_tools"
