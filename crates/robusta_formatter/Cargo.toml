[package]
name = "robusta_formatter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Java formatting and trivia policy for robusta."
publish = false

[lints]
workspace = true

[lib]
doctest = false

[features]
default = []
check_idempotency = []
detect_code_removal = []

[dependencies]
robusta_allocator.workspace = true
robusta_formatter_core.workspace = true
robusta_javadoc.workspace = true
robusta_span.workspace = true
robusta_syntax.workspace = true
robusta_ast.workspace = true
robusta_ast_visit.workspace = true
robusta_diagnostics.workspace = true
robusta_lexer.workspace = true
robusta_parser.workspace = true
markdown.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true

[dev-dependencies]
cow-utils.workspace = true
insta.workspace = true
robusta_formatter_tests.workspace = true
# Enables the source checks for this crate's own tests.
robusta_formatter = { path = ".", features = ["check_idempotency", "detect_code_removal"] }
