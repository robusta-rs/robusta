[package]
name = "robusta_cli"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lib]
doctest = false

[[bin]]
name = "robusta"
path = "src/main.rs"

[features]
default = []
check_idempotency = ["robusta_formatter/check_idempotency"]
detect_code_removal = ["robusta_formatter/detect_code_removal"]

[lints]
workspace = true

[dependencies]
bpaf.workspace = true
cow-utils.workspace = true
editorconfig-parser.workspace = true
indexmap.workspace = true
percent-encoding.workspace = true
rayon.workspace = true
robusta_allocator = { workspace = true, features = ["pool"] }
robusta_config.workspace = true
robusta_parser.workspace = true
robusta_formatter.workspace = true
robusta_diagnostics.workspace = true
robusta_linter.workspace = true
robusta_semantic.workspace = true
robusta_span.workspace = true
robusta_syntax.workspace = true
rustc-hash.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
similar.workspace = true
simdutf8.workspace = true

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_arch = "arm", target_arch = "riscv64", target_family = "wasm")))'.dependencies]
mimalloc-safe = { workspace = true, features = ["skip_collect_on_exit"] }

[target.'cfg(all(target_os = "linux", not(target_arch = "arm"), not(target_arch = "aarch64"), not(target_arch = "riscv64")))'.dependencies]
mimalloc-safe = { workspace = true, features = [
    "skip_collect_on_exit",
    "local_dynamic_tls",
] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
mimalloc-safe = { workspace = true, features = [
    "skip_collect_on_exit",
    "local_dynamic_tls",
    "no_opt_arch",
] }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
