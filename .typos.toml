# https://github.com/crate-ci/typos
# cargo install typos-cli
# typos

[files]
extend-exclude = [
  # Formatter fixture corpora are real-world Java and must not be "corrected".
  "crates/robusta_formatter/tests/fixtures/**",
  # Snapshot outputs are generated and may contain intentional artifacts.
  "**/*.snap",
]

[default]
extend-ignore-re = [
  # Honor inline spellchecker directives.
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
  "(?Rm)^\\s*(#|//)\\s*spellchecker:disable-next-line\\s*\\n.*",
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

[default.extend-words]
# Gradle's `-P` flag joined to the `release` property.
prelease = "prelease"
